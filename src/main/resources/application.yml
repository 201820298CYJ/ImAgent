spring:
  application:
    name: yu-ai-agent
  profiles:
    active: local
  ai:
    dashscope:
      api-key: sk-10eacff4931944bca218fc14b52e310d
      chat:
        options:
          model: qwen-plus
# 临时注释掉，便于大家开发调试和部署
    mcp:
      client:
#        sse:
#          connections:
#            server1:
#              url: http://localhost:8127
        stdio:
          servers-configuration: classpath:mcp-servers.json
  # Elasticsearch 配置
  elasticsearch:
    uris: ${ES_URI:http://localhost:9200}
    # username: elastic
    # password: your-password

  # PostgreSQL 数据源配置（pgvector）
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:5432/yu_ai_agent
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # Redis 配置（会话记忆 ChatMemory）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      # password: your-password
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2s

# 会话记忆配置
chat:
  memory:
    redis:
      key-prefix: "chat:memory:"
      ttl-hours: 24
      max-messages: 100

  # DashScope Rerank 配置
dashscope:
  rerank:
    api-key: ${spring.ai.dashscope.api-key}
    model: gte-rerank

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi config
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yupi.yuaiagent.controller
# knife4j config
knife4j:
  enable: true
  setting:
    language: zh_cn
# 修改日志级别，查看 Spring AI 更多调用细节
logging:
  level:
    org.springframework.ai: DEBUG