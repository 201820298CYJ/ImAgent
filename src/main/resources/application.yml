spring:
  application:
    name: yu-ai-agent
  profiles:
    active: local
  ai:
    dashscope:
      api-key: sk-10eacff4931944bca218fc14b52e310d
      chat:
        options:
          model: qwen-plus
# 临时注释掉，便于大家开发调试和部署
    mcp:
      client:
#        sse:
#          connections:
#            server1:
#              url: http://localhost:8127
        stdio:
          servers-configuration: classpath:mcp-servers.json
  # Elasticsearch 配置
  elasticsearch:
    uris: http://localhost:9200
    # username: elastic
    # password: your-password

  # PostgreSQL 数据源配置（pgvector）
  datasource:
    url: jdbc:postgresql://localhost:5432/yu_ai_agent
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # DashScope Rerank 配置
dashscope:
  rerank:
    api-key: ${spring.ai.dashscope.api-key}
    model: gte-rerank

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi config
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yupi.yuaiagent.controller
# knife4j config
knife4j:
  enable: true
  setting:
    language: zh_cn
# searchAPI
search-api:
  api-key: zEffiRgLvvhtXnvxUGSYD3TN
# 修改日志级别，查看 Spring AI 更多调用细节
logging:
  level:
    org.springframework.ai: DEBUG